<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gym Log">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Gym Log</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #111; color: #eee; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1.5rem; margin: 16px 0; }
    button, select, input, textarea { font-size: 1.2rem; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #222; color: #eee; font-family: inherit; }
    .pe { display: flex; gap: 8px; margin-top: 10px; }
    .pe > div { flex: 1; min-width: 0; }
    .pe select { width: 100%; font-size: 1.2rem; padding: 12px 8px; }
    .cap { display: block; color: #aaa; font-size: 0.75rem; margin-bottom: 2px; }
    .wr .total { flex: 1; font-size: 1.1rem; color: #cbd5e1; }
    .wr .total b { color: #eee; font-size: 1.3rem; }
    .two select { font-size: 1.2rem; padding: 14px 10px; }
    button.chip { padding: 8px 12px; font-size: 1rem; margin: 6px 6px 0 0; border-radius: 8px; }
    select { width: 100%; font-size: 1.5rem; }
    .field { width: 100%; box-sizing: border-box; }
    label { display: block; margin: 16px 0 6px; color: #aaa; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choices button { flex: 1; }
    button.active { background: #2563eb; border-color: #2563eb; }
    button.primary { width: 100%; background: #16a34a; border-color: #16a34a; font-size: 1.3rem; padding: 18px; margin-top: 12px; }
    button.secondary { width: 100%; background: #2563eb; border-color: #2563eb; font-size: 1.1rem; padding: 14px; margin-top: 24px; }
    button.ghost { width: 100%; background: transparent; margin-top: 12px; }
    button.item { display: block; width: 100%; text-align: left; margin-top: 8px; }
    button.item small { display: block; color: #aaa; font-size: 0.9rem; margin-top: 4px; }
    .panel { border: 1px solid #444; border-radius: 10px; padding: 4px 12px 12px; margin-top: 16px; }
    .panel strong { display: block; margin-top: 8px; }
    .note { background: #1e293b; border-radius: 10px; padding: 10px 12px; margin-top: 12px; color: #cbd5e1; }
    .other { display: flex; gap: 8px; margin-top: 8px; }
    .other input { flex: 1; min-width: 0; font-size: 1rem; }
    .other button { font-size: 1rem; }
    .muted { color: #aaa; margin-top: 12px; }
    button.outline { width: 100%; background: transparent; border-color: #16a34a; color: #4ade80; font-size: 1.3rem; padding: 18px; margin-top: 8px; }
    .finished { text-align: center; color: #4ade80; margin-top: 24px; }
    .two { display: flex; gap: 8px; }
    .two > div { flex: 1; }
    .progress { text-align: center; color: #cbd5e1; margin-top: 16px; }
    .topbar { display: flex; gap: 8px; }
    .topbar button { margin-top: 0; width: auto; flex: 1; }
    .topbar #back { flex: 2; }
    .card { border: 1px solid #444; border-radius: 12px; padding: 10px 12px 12px; margin-top: 14px; }
    .cardhead { display: flex; justify-content: space-between; align-items: center; }
    .cardhead strong { font-size: 1.2rem; }
    button.link { background: transparent; border: none; color: #93c5fd; padding: 6px 4px; font-size: 0.9rem; text-decoration: underline; width: auto; margin: 0; }
    .card .note { margin-top: 8px; padding: 6px 10px; font-size: 0.9rem; }
    .wr { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    .wr select { flex: 1; width: auto; min-width: 0; font-size: 1.2rem; padding: 12px 8px; }
    .wr button { width: 48px; padding: 12px 0; font-size: 1.4rem; }
    .wr .val { min-width: 52px; text-align: center; font-size: 1.3rem; }
    .wr .val small { display: block; font-size: 0.7rem; color: #aaa; }
    details { margin-top: 8px; color: #aaa; }
    summary { padding: 4px 0; }
    .card .logrow { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
    .card .logrow .progress { margin: 0; flex: 1; text-align: left; }
    .card .logrow button { flex: 1.2; width: auto; margin: 0; padding: 14px; }
    .card .finished { margin-top: 10px; }
    .small { font-size: 0.9rem; }
    .tm { font-variant-numeric: tabular-nums; }
    .timebar { display: flex; align-items: center; justify-content: space-between; background: #1e293b; border-radius: 10px; padding: 10px 14px; margin: 12px 0; color: #cbd5e1; }
    .timebar .tm { font-size: 1.4rem; color: #eee; }
    .cardhead .cardtime { color: #93c5fd; font-size: 1.2rem; padding: 0 8px; }
        html { -webkit-text-size-adjust: 100%; }
    button, select, input, textarea, summary { touch-action: manipulation; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { sessionTypes, exercises, exercisesForGroup } from "./exercises.js";
    import { emptySettings, allExercises, configFor, updateExercise, toNumber } from "./settings.js";
    import { effectiveConfig, globalDefaults, updateGlobalDefaults } from "./defaults.js";
    import {
      makeSet, todaysSets, defaultsFor, removeLastSet, weightOptions,
      isDoneToday, markDone, unmarkDone,
    } from "./log.js";
    import {
      formatTime, startWorkout, isRunning, workoutElapsed, machineElapsed,
      runMachines, endWorkout, cleanWorkout,
    } from "./timer.js";
    import { hasExtras, extraOptions, totalWeight, splitFor } from "./extras.js";
    import { STEP_CHOICES, buildPins, addPin, removePin, describePins, hasPins } from "./stacks.js";
    import { cleanStore, migrateLegacy, toLegacySettings, applyLegacySettings } from "./store.js";

    const SETS_KEY = "gymlog.sets";
    const SESSION_KEY = "gymlog.session";
    const SETTINGS_KEY = "gymlog.settings";
    const DONE_KEY = "gymlog.done";
    const WORKOUT_KEY = "gymlog.workout";
    const STORE_KEY = "gymlog.store";

    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch { return fallback; }
    }
    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); }
      catch { /* storage unavailable: the app still works for this visit */ }
    }

    let sets = load(SETS_KEY, []);
    if (!Array.isArray(sets)) sets = [];
    // The permanent store. The first time, it is built from the old gymlog.settings data, which is left
// untouched as a backup. The rest of the app keeps working with the settings shape below.
let store = cleanStore(load(STORE_KEY, null));
if (!store) {
  store = migrateLegacy(load(SETTINGS_KEY, {}));
  save(STORE_KEY, store);
}
let settings = { ...emptySettings(), ...toLegacySettings(store, store.currentPerson, store.currentGym) };

function saveSettings() {
  store = applyLegacySettings(store, store.currentPerson, store.currentGym, settings);
  save(STORE_KEY, store);
}
    let done = load(DONE_KEY, []);           // exercises finished today: { exerciseId, date }
    if (!Array.isArray(done)) done = [];
    // The workout timer: started by opening the first exercise, stopped by End workout. A workout
    // left over from an earlier day is dropped.
    let workout = cleanWorkout(load(WORKOUT_KEY, null), Date.now());

    // The selected session. Whatever is selected is remembered and is what Quick start uses.
    let session = { type: "legs", mode: "heavy", ...load(SESSION_KEY, {}) };
    if (!sessionTypes.some((t) => t.id === session.type)) session.type = "legs";
    if (session.mode !== "volume") session.mode = "heavy";

    let screen = "start";          // "start", "list", "exercise", "pick", "setup" or "edit"
    let showMore = false;
    let showDone = false;          // is the "done today" list open on the exercise list?
    let panels = [];               // exercises on the logging page: one, or two when supersetting
    let pickMore = false;          // show less common exercises when picking a superset partner
    let editId = null;             // the exercise being set up
    let flash = "";                // a short message shown once, e.g. "Defaults saved"
    let stackFilter = "all";       // Machine setup list: "all", "legs" or "arms"
    let stackId = null;            // the machine being set up on the Machine setup screen
    let stackPins = [];            // the pin list being built for that machine

    const app = document.getElementById("app");
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    const typeInfo = (id) => sessionTypes.find((t) => t.id === id);

    const exList = () => allExercises(exercises, settings);        // includes your renames and steps
    const hasDayType = () => typeInfo(session.type).weights;       // Legs and Arms only
    const dayMode = () => (hasDayType() ? session.mode : null);    // "heavy", "volume" or null
    const modeKey = () => (dayMode() === "heavy" ? "Heavy" : "Volume");  // sessions without a day type use the Volume settings

    // Text from a box to a whole number above zero, or null if blank or invalid.
    function wholeOrNull(text) {
      const n = toNumber(text);
      return n !== null && Math.round(n) > 0 ? Math.round(n) : null;
    }

    function numField(id, label, value, placeholder) {
      return '<label for="' + id + '">' + label + "</label>" +
        '<input class="field" id="' + id + '" type="number" inputmode="decimal" step="any" min="0" value="' +
        (value === null ? "" : value) + '" placeholder="' + placeholder + '">';
    }

    function sessionLabel(s) {
      const t = typeInfo(s.type);
      return t.weights ? t.label + " · " + (s.mode === "volume" ? "Volume" : "Heavy") : t.label;
    }

    // ---------- Timers ----------
    // The workout starts by itself when you open an exercise and stops when you tap End workout.
    // A machine's clock runs while it is on the logging page (or the superset picker) and is not
    // finished. Times come from the clock, so they stay right when the phone sleeps.
    function syncTimers() {
      const want = (screen === "exercise" || screen === "pick")
        ? panels.filter((p) => !isDoneToday(done, p.ex.id)).map((p) => p.ex.id)
        : [];
      if (want.length > 0 && !isRunning(workout)) workout = startWorkout(Date.now());
      if (!isRunning(workout)) return;
      workout = runMachines(workout, want, Date.now());
      save(WORKOUT_KEY, workout);
    }

    // The total workout time, shown on every screen except the machine page while a workout is on.
    // After End workout it stays visible on the exercise list only.
    function timeBar() {
      if (!workout) return "";
      if (!isRunning(workout) && screen !== "list") return "";
      return '<div class="timebar"><span>' + (isRunning(workout) ? "Workout" : "Workout finished") + "</span>" +
        '<span class="tm" data-t="workout">' + formatTime(workoutElapsed(workout, Date.now())) + "</span></div>";
    }

        // Keeps the screen on while a workout is running and the app is on screen (where the phone supports it).
    let wakeLock = null, waking = false;
    async function keepAwake() {
      if (waking || !("wakeLock" in navigator)) return;
      waking = true;
      try {
        const want = isRunning(workout) && document.visibilityState === "visible";
        if (want && !wakeLock) {
          wakeLock = await navigator.wakeLock.request("screen");
          wakeLock.addEventListener("release", () => { wakeLock = null; });
        } else if (!want && wakeLock) {
          await wakeLock.release();
          wakeLock = null;
        }
      } catch { wakeLock = null; }
      waking = false;
    }
    // Updates the clocks on screen once a second without redrawing the page.
    function tick() {
      const now = Date.now();
      document.querySelectorAll("[data-t]").forEach((el) => {
        const t = el.dataset.t;
        el.textContent = formatTime(t === "workout" ? workoutElapsed(workout, now) : machineElapsed(workout, t.slice(2), now));
      });
    }
    setInterval(tick, 1000);
    document.addEventListener("visibilitychange", tick);

    function go(name) {
      screen = name;
      armBack();
      render();
      window.scrollTo(0, 0);
    }

    // The phone's back button or gesture steps back one screen instead of closing the app.
    const BACK = { list: "start", setup: "start", edit: "setup", pick: "exercise", stacks: "start", stackEdit: "stacks" };

    function armBack() {
      if (!history.state || !history.state.armed) history.pushState({ armed: true }, "");
    }

    window.addEventListener("popstate", () => {
      if (screen === "start") return;                  // on the start screen, back leaves the app as usual
      if (screen === "exercise") panels = [];          // same as the Back button on the machine page
      go(screen === "exercise" ? "list" : BACK[screen]);
    });

        function render() {
      syncTimers();
      if (screen === "start") renderStart();
      else if (screen === "list") renderList();
      else if (screen === "setup") renderSetup();
      else if (screen === "edit") renderEdit();
      else if (screen === "pick") renderPick();
      else if (screen === "stacks") renderStacks();
      else if (screen === "stackEdit") renderStackEdit();
      else renderExercise();
    }

    function choiceButton(label, active, onclick) {
      const b = document.createElement("button");
      b.textContent = label;
      if (active) b.className = "active";
      b.onclick = onclick;
      return b;
    }

    // ---------- Start screen ----------
    function renderStart() {
      const t = typeInfo(session.type);
      app.innerHTML =
        "<h1>Gym Log</h1>" + timeBar() +
        '<button class="primary" id="quick">Quick start: ' + esc(sessionLabel(session)) + "</button>" +
        "<label>Session</label>" +
        '<div class="choices" id="types"></div>' +
        (t.weights ? '<label>Day type</label><div class="choices" id="modes"></div>' : "") +
        '<button class="secondary" id="setupBtn">Set up ' + esc(sessionLabel(session)) + "</button>" +
        '<button class="link" id="stacksBtn" style="display:block;margin:32px auto 0;opacity:0.6">Machine setup</button>';

      // Choosing a session or day type updates Quick start and is remembered straight away.
      const choose = (change) => { Object.assign(session, change); save(SESSION_KEY, session); renderStart(); };

      for (const st of sessionTypes) {
        $("types").appendChild(choiceButton(st.label, st.id === session.type, () => choose({ type: st.id })));
      }
      if (t.weights) {
        $("modes").appendChild(choiceButton("Heavy", session.mode === "heavy", () => choose({ mode: "heavy" })));
        $("modes").appendChild(choiceButton("Volume", session.mode === "volume", () => choose({ mode: "volume" })));
      }
      $("quick").onclick = () => { showMore = false; go("list"); };
      $("setupBtn").onclick = () => go("setup");
      $("stacksBtn").onclick = () => go("stacks");
    }

    // ---------- Exercise list ----------
    function renderList() {
      const all = exercisesForGroup(session.type, true, exList());
      // Finished exercises include any pull-ups done as a superset on an arms day.
      const finished = sessionPool().filter((e) => isDoneToday(done, e.id));
      const open = all.filter((e) => !isDoneToday(done, e.id));
      const openCommon = open.filter((e) => e.common);
      const shown = showMore ? open : openCommon;

      let message = "";
      if (all.length === 0) message = "No exercises here yet. You will be able to add some in a later step.";
      else if (shown.length === 0 && finished.length > 0) message = open.length === 0 ? "All done for today. Nice work." : "All the main exercises are done.";

      app.innerHTML =
        timeBar() + '<button class="ghost" id="change" style="margin-top:0">' + esc(sessionLabel(session)) + " &#9662; change</button>" +
        '<div id="list"></div>' +
        (message ? '<div class="muted">' + message + "</div>" : "") +
        (open.length > openCommon.length ? '<button class="ghost" id="more">' + (showMore ? "Hide less common" : "Show less common") + "</button>" : "") +
        (finished.length > 0 ? '<button class="ghost" id="doneToggle">' + (showDone ? "Hide" : "Show") + " done today (" + finished.length + ")</button>" : "") +
        '<div id="doneList"></div>' +
        (isRunning(workout) ? '<button class="secondary" id="endWorkout">End workout</button>' : "");

      for (const e of shown) {
        const b = document.createElement("button");
        b.className = "item";
        b.textContent = e.name;
        b.onclick = () => openExercise(e);
        $("list").appendChild(b);
      }
      if (showDone) {
        for (const e of finished) {
          const n = todaysSets(sets, e.id).length;
          const b = document.createElement("button");
          b.className = "item";
          b.innerHTML = "&#10003; " + esc(e.name) + "<small>" + n + (n === 1 ? " set" : " sets") + " &middot; tap to view or reopen</small>";
          b.onclick = () => openExercise(e);
          $("doneList").appendChild(b);
        }
      }
      $("change").onclick = () => go("start");
      if ($("more")) $("more").onclick = () => { showMore = !showMore; renderList(); };
      if ($("doneToggle")) $("doneToggle").onclick = () => { showDone = !showDone; renderList(); };
      if ($("endWorkout")) $("endWorkout").onclick = () => {
        if (confirm("End the workout and stop the timer?")) {
          workout = endWorkout(workout, Date.now());
          save(WORKOUT_KEY, workout);
          renderList();
        }
      };
    }

    // ---------- Exercise screen ----------
    // The logging page shows one exercise, or two when supersetting. Every exercise uses the same
    // compact card with its own weight, reps, Log set, Undo and Finish buttons.
     function resetPanel(p) {
      const cfg = effectiveConfig(settings, p.ex.id);
      const d = defaultsFor(p.ex, sets, cfg, dayMode() ?? "volume");
      p.reps = d.reps;
      p.weight = d.weight;
      if (!hasExtras(p.ex)) return;
      // Machines with extras: keep the pin and extra already chosen when the total is unchanged
      // (the next set at the same weight), otherwise work them out from the total.
      if (p.pin !== undefined && totalWeight(p.pin, p.extra) === d.weight) return;
      const s = splitFor(settings, p.ex, d.weight, cfg, modeKey());
      p.pin = s.pin;
      p.extra = s.extra;
    }

    function newPanel(e) {
      const p = { ex: e, weight: 0, reps: 5 };
      resetPanel(p);
      return p;
    }

    function openExercise(e) {
      panels = [newPanel(e)];
      go("exercise");
    }

        // The list of extra weights a machine offers, with "None" first.
    function extraSelectHtml(id, e, chosen) {
      return '<select id="' + id + '"><option value="0">None</option>' +
        extraOptions(e)
          .map((x) => '<option value="' + x + '"' + (x === chosen ? " selected" : "") + ">+" + x + " " + e.unit + "</option>")
          .join("") +
        "</select>";
    }

    function panelHtml(p, i) {
      const e = p.ex;
      const cfg = effectiveConfig(settings, e.id);
      const key = modeKey();
      const today = todaysSets(sets, e.id);
      const hasWarmup = cfg["start" + key] !== null;
      const totalSets = cfg["sets" + key] + (hasWarmup ? 1 : 0);
      const complete = today.length >= totalSets;
      const finished = isDoneToday(done, e.id);
      const progress = complete
        ? "All " + totalSets + " sets done"
        : "Set " + (today.length + 1) + " of " + totalSets + (hasWarmup && today.length === 0 ? " (warm-up)" : "");
      const withExtras = hasExtras(e);
      const shown = withExtras ? p.pin : p.weight;     // the pin position, or the whole weight when there is no pin
      const optionHtml = weightOptions(e, shown)
        .map((w) => '<option value="' + w + '"' + (w === shown ? " selected" : "") + ">" + w + " " + e.unit + "</option>")
        .join("");
      const notes = cfg.notes ? '<div class="note">' + esc(cfg.notes).replace(/\n/g, "<br>") + "</div>" : "";
      const logClass = complete ? "outline" : "primary";
      // Finish appears once there is a set to save. It turns green when all target sets are done.
      const finishHtml = finished
        ? '<div class="finished">&#10003; Finished for today</div><button class="outline" id="reopen' + i + '">Reopen exercise</button>'
        : today.length > 0
          ? '<button class="' + (complete ? "primary" : "secondary") + '" id="finish' + i + '" style="margin-top:12px">Finish exercise</button>'
          : "";
      const setsText = today.length === 0
        ? "No sets yet"
        : today.map((s) => s.weight + " " + e.unit + " x " + s.reps).join(" &middot; ");

      const repsHtml = '<button id="rMinus' + i + '">-</button><span class="val">' + p.reps + " <small>reps</small></span>" +
        '<button id="rPlus' + i + '">+</button>';
      // Machines with extras: a pin list and an extra list, then the total beside the reps.
      // Other exercises: one weight list and an "Other weight" box.
      const weightHtml = withExtras
        ? '<div class="pe"><div><span class="cap">Pin</span><select id="weightSel' + i + '">' + optionHtml + "</select></div>" +
          '<div><span class="cap">Extra</span>' + extraSelectHtml("extraSel" + i, e, p.extra) + "</div></div>" +
          '<div class="wr"><span class="total">Total <b>' + p.weight + " " + e.unit + "</b></span>" + repsHtml + "</div>"
        : '<div class="wr"><select id="weightSel' + i + '">' + optionHtml + "</select>" + repsHtml + "</div>" +
          "<details><summary>Other weight (" + e.unit + ")</summary>" +
          '<div class="other"><input id="otherW' + i + '" type="number" inputmode="decimal" step="any" placeholder="e.g. 12.5"><button id="otherBtn' + i + '">Set</button></div></details>';

      return '<div class="card">' +
        '<div class="cardhead"><strong>' + esc(e.name) + "</strong>" +
        '<span class="tm cardtime" data-t="m:' + esc(e.id) + '">' + formatTime(machineElapsed(workout, e.id, Date.now())) + "</span>" +
        (panels.length > 1 ? '<button class="link" id="remove' + i + '">Remove</button>' : "") + "</div>" +
        notes +
        weightHtml +
        '<div class="logrow"><span class="progress">' + progress + '</span><button class="' + logClass + '" id="logBtn' + i + '">Log set</button></div>' +
        '<div class="muted small">' + setsText + (today.length > 0 ? ' <button class="link" id="undo' + i + '">Undo last set</button>' : "") + "</div>" +
        finishHtml + "</div>";
    }

        function bindPanel(p, i) {
      const e = p.ex;
      const on = (name, fn) => { const el = $(name + i); if (el) el.onclick = fn; };

      $("weightSel" + i).onchange = (ev) => {
        const v = Number(ev.target.value);
        if (hasExtras(e)) {
          p.pin = v;
          p.weight = totalWeight(p.pin, p.extra);
          renderExercise();
        } else {
          p.weight = v;
        }
      };
      if ($("extraSel" + i)) {
        $("extraSel" + i).onchange = (ev) => {
          p.extra = Number(ev.target.value);
          p.weight = totalWeight(p.pin, p.extra);
          renderExercise();
        };
      }
      on("otherBtn", () => {
        const v = parseFloat($("otherW" + i).value);
        if (Number.isFinite(v) && v >= 0) { p.weight = v; renderExercise(); }
      });
      on("rMinus", () => { p.reps = Math.max(0, p.reps - 1); renderExercise(); });
      on("rPlus", () => { p.reps = p.reps + 1; renderExercise(); });
      on("logBtn", () => {
        sets.push(makeSet({ exerciseId: e.id, weight: p.weight, reps: p.reps, mode: dayMode() || undefined }));
        save(SETS_KEY, sets);
        resetPanel(p);
        renderExercise();
      });
      on("undo", () => {
        sets = removeLastSet(sets, e.id);
        save(SETS_KEY, sets);
        resetPanel(p);
        renderExercise();
      });
      // Sets are saved as you log them. Finish marks only this exercise as done for today and takes it
      // off the list. If it was one of a superset, the other exercise stays on the page.
      on("finish", () => {
        done = markDone(done, e.id);
        save(DONE_KEY, done);
        showDone = false;
        panels.splice(i, 1);
        go(panels.length === 0 ? "list" : "exercise");
      });
      on("reopen", () => {
        done = unmarkDone(done, e.id);
        save(DONE_KEY, done);
        renderExercise();
      });
      // Take this exercise off the page without finishing it. Its sets are kept.
      on("remove", () => {
        panels.splice(i, 1);
        go("exercise");
      });
    }

    function renderExercise() {
      syncTimers();
      const two = panels.length > 1;
      app.innerHTML =
        '<div class="topbar"><button class="ghost" id="back">&larr; ' + (two ? "Back to list" : "Pick another machine") + "</button>" +
        (two ? "" : '<button class="ghost" id="superset">+ Superset</button>') + "</div>" +
        panels.map((p, i) => panelHtml(p, i)).join("");

      $("back").onclick = () => { panels = []; go("list"); };
      if ($("superset")) $("superset").onclick = () => { pickMore = false; go("pick"); };
      panels.forEach(bindPanel);
    }

    // ---------- Pick a superset exercise ----------
    // Only this session's exercises (legs on a legs day, arms on an arms day). Pull-ups are the
    // exception: they can also be paired on an arms day.
    const ANY_DAY_SUPERSET = ["pull-up"];

    // This session's exercises, plus the any-day ones when the session is legs or arms.
    function sessionPool() {
      const own = exercisesForGroup(session.type, true, exList());
      const extra = hasDayType()
        ? exList().filter((e) => ANY_DAY_SUPERSET.includes(e.id) && !own.some((o) => o.id === e.id))
        : [];
      return [...own, ...extra];
    }

    function renderPick() {
      const onPage = new Set(panels.map((p) => p.ex.id));
      const choices = sessionPool().filter((e) => !onPage.has(e.id) && !isDoneToday(done, e.id));
      const common = choices.filter((e) => e.common);
      const shown = pickMore ? choices : common;

      app.innerHTML =
        '<button class="ghost" id="back" style="margin-top:0">&larr; Back</button>' +
        timeBar() + "<h2>Add a superset exercise</h2>" +
        '<div id="pickList"></div>' +
        (shown.length === 0 ? '<div class="muted">No other exercises left to add.</div>' : "") +
        (choices.length > common.length ? '<button class="ghost" id="pickMore">' + (pickMore ? "Hide less common" : "Show less common") + "</button>" : "");

      for (const e of shown) {
        const b = document.createElement("button");
        b.className = "item";
        b.textContent = e.name;
        b.onclick = () => { panels.push(newPanel(e)); go("exercise"); };
        $("pickList").appendChild(b);
      }
      $("back").onclick = () => go("exercise");
      if ($("pickMore")) $("pickMore").onclick = () => { pickMore = !pickMore; renderPick(); };
    }

    // ---------- Set up session: list of machines ----------
    function summary(e, cfg, key) {
      const parts = [];
      if (cfg["start" + key] !== null) parts.push("Warm-up " + cfg["start" + key] + " " + e.unit);
      if (cfg["work" + key] !== null) parts.push("Working " + cfg["work" + key] + " " + e.unit);
      if (cfg["reps" + key] !== null) parts.push(cfg["reps" + key] + " reps");
      if (cfg["sets" + key] !== null) parts.push(cfg["sets" + key] + " sets");
      return parts.length ? parts.join(" · ") : "Uses the defaults";
    }

    function renderSetup() {
      const list = exercisesForGroup(session.type, true, exList());
      const key = modeKey();
      const g = globalDefaults(settings);
      app.innerHTML =
        '<button class="ghost" id="back" style="margin-top:0">&larr; Back</button>' +
        timeBar() + "<h2>Set up " + esc(sessionLabel(session)) + "</h2>" +
        '<div class="panel"><strong>Defaults for every machine · ' + key + " day</strong>" +
        '<div class="two"><div>' + numField("g_reps", "Reps", g["reps" + key], "") + "</div>" +
        "<div>" + numField("g_sets", "Sets", g["sets" + key], "") + "</div></div>" +
        '<button class="secondary" id="saveDefaults" style="margin-top:12px">Save defaults</button>' +
        (flash ? '<div class="muted">' + flash + "</div>" : "") +
        (hasDayType() ? "" : '<div class="muted">' + esc(typeInfo(session.type).label) + " uses the Volume day defaults.</div>") +
        "</div>" +
        '<div class="muted">Tap a machine to give it its own weights, reps or sets.</div>' +
        '<div id="list"></div>' +
        (list.length === 0 ? '<div class="muted">No exercises here yet. You will be able to add some in a later step.</div>' : "");
      flash = "";

      for (const e of list) {
        const b = document.createElement("button");
        b.className = "item";
        b.innerHTML = esc(e.name) + "<small>" + esc(summary(e, configFor(settings, e.id), key)) + "</small>";
        b.onclick = () => { editId = e.id; go("edit"); };
        $("list").appendChild(b);
      }
      $("back").onclick = () => go("start");
      $("saveDefaults").onclick = () => {
        settings = updateGlobalDefaults(settings, {
          ["reps" + key]: wholeOrNull($("g_reps").value),
          ["sets" + key]: wholeOrNull($("g_sets").value),
        });
        save(SETTINGS_KEY, settings);
        flash = "Defaults saved";
        renderSetup();
      };
    }

    // ---------- Set up session: one machine ----------
        // ---------- Set up session: one machine ----------
    function renderEdit() {
      const e = exList().find((x) => x.id === editId);
      const cfg = configFor(settings, e.id);
      const key = modeKey();
      const eff = effectiveConfig(settings, e.id);   // what this machine uses right now
      const withExtras = hasExtras(e);
      const savedExtra = (kind) => {
        const x = ((settings.exercises || {})[e.id] || {})[kind + "Extra" + key];
        return Number.isFinite(x) ? x : 0;
      };

      // A warm-up or working weight. Machines with extras get a pin box and an extra list (the total is the sum).
      const weightField = (kind, label, pinLabel, optional) => {
        const total = cfg[kind + key];
        const unit = e.unit + (optional ? ", optional" : "");
        if (!withExtras) return numField("f_" + kind, label + " (" + unit + ")", total, "none");
        const extra = total === null ? 0 : savedExtra(kind);
        const pin = total === null ? null : totalWeight(total, -extra);
        return '<div class="two"><div>' + numField("f_" + kind, pinLabel + " (" + e.unit + ")", pin, "none") + "</div>" +
          '<div><label for="f_' + kind + 'Extra">Extra</label>' + extraSelectHtml("f_" + kind + "Extra", e, extra) + "</div></div>";
      };

      app.innerHTML =
        '<button class="ghost" id="back" style="margin-top:0">&larr; Back without saving</button>' +
        timeBar() + "<h2>" + esc(e.name) + "</h2>" +
        '<label for="f_name">Name</label>' +
        '<input class="field" id="f_name" type="text" value="' + esc(e.name) + '">' +
        numField("f_step", "Weight step (" + e.unit + ")", e.step, "") +
        '<div class="panel"><strong>' + esc(sessionLabel(session)) + " for this machine</strong>" +
        weightField("start", "Warm-up weight, first set", "Warm-up pin", true) +
        weightField("work", "Working weight", "Working pin", false) +
        (withExtras ? '<div class="muted">The warm-up is optional and is the first set. The weight used is the pin plus the extra.</div>' : "") +
        '<div class="two"><div>' + numField("f_reps", "Reps", cfg["reps" + key], "default " + eff["reps" + key]) + "</div>" +
        "<div>" + numField("f_sets", "Sets", cfg["sets" + key], "default " + eff["sets" + key]) + "</div></div>" +
        '<div class="muted">Leave reps or sets blank to use the defaults for every machine.</div>' +
        "</div>" +
        '<label for="f_notes">Notes (seat height, pad position, etc.)</label>' +
        '<textarea class="field" id="f_notes" rows="3">' + esc(cfg.notes) + "</textarea>" +
        '<button class="primary" id="save">Save</button>';

      $("back").onclick = () => go("setup");
      $("save").onclick = () => {
        const patch = {
          name: $("f_name").value.trim() || undefined,
          step: toNumber($("f_step").value),
          notes: $("f_notes").value,
        };
        for (const kind of ["start", "work"]) {
          const typed = toNumber($("f_" + kind).value);
          if (!withExtras) {
            patch[kind + key] = typed;
            continue;
          }
          const extra = typed === null ? 0 : Number($("f_" + kind + "Extra").value);
          patch[kind + key] = typed === null ? null : totalWeight(typed, extra);     // the total is what is used
          patch[kind + "Extra" + key] = typed === null || extra === 0 ? null : extra; // remembered so the pin shows again
        }
        patch["reps" + key] = wholeOrNull($("f_reps").value);
        patch["sets" + key] = wholeOrNull($("f_sets").value);
        settings = updateExercise(settings, e.id, patch);
        save(SETTINGS_KEY, settings);
        go("setup");
      };
    }

        // ---------- Machine setup: the pin weights on each machine ----------
    // A one-off job done at the gym (it can be repeated for any machine). The saved pin list
    // replaces the step-based weight list for that machine.
    function stackMachines() {
      return exList().filter((e) => e.unit === "lb" && e.kind !== "time" && (e.group === "legs" || e.group === "arms"));
    }

    function renderStacks() {
      const all = stackMachines();
      const shown = stackFilter === "all" ? all : all.filter((e) => e.group === stackFilter);
      const ready = all.filter(hasPins).length;
      app.innerHTML =
        '<button class="ghost" id="back" style="margin-top:0">&larr; Back</button>' +
        "<h2>Machine setup</h2>" +
        '<div class="muted">' + ready + " of " + all.length + " machines done. Tap a machine to enter its weights. You can redo any machine later.</div>" +
        '<div class="choices" id="filters" style="margin-top:12px"></div>' +
        '<div id="list"></div>';

      for (const [id, label] of [["all", "All"], ["legs", "Legs"], ["arms", "Arms"]]) {
        $("filters").appendChild(choiceButton(label, stackFilter === id, () => { stackFilter = id; renderStacks(); }));
      }
      for (const e of shown) {
        const b = document.createElement("button");
        b.className = "item";
        b.innerHTML = (hasPins(e) ? "&#10003; " : "") + esc(e.name) + "<small>" + esc(hasPins(e) ? describePins(e.pins) : "Not set up") + "</small>";
        b.onclick = () => { stackId = e.id; stackPins = hasPins(e) ? [...e.pins] : []; go("stackEdit"); };
        $("list").appendChild(b);
      }
      $("back").onclick = () => go("start");
    }

    function renderStackEdit() {
      const e = exList().find((x) => x.id === stackId);
      const saved = ((settings.exercises || {})[e.id] || {}).stackSpec || {};
      const ch = Array.isArray(saved.changes) ? saved.changes : [];

      const stepSelect = (id, chosen, optional) =>
        '<select id="' + id + '">' + (optional ? '<option value="">None</option>' : "") +
        STEP_CHOICES.map((s) => '<option value="' + s + '"' + (s === chosen ? " selected" : "") + ">" + s + " lb</option>").join("") +
        "</select>";
      const changeRow = (n) => {
        const c = ch[n - 1] || {};
        return '<div class="two"><div>' + numField("s_at" + n, "From weight (lb)", c.at ?? null, "e.g. 100") + "</div>" +
          '<div><label for="s_cs' + n + '">New step</label>' + stepSelect("s_cs" + n, c.step, true) + "</div></div>";
      };

      app.innerHTML =
        '<button class="ghost" id="back" style="margin-top:0">&larr; Back without saving</button>' +
        "<h2>" + esc(e.name) + "</h2>" +
        numField("s_low", "Lowest pin (lb)", saved.low ?? null, "e.g. 10") +
        '<label for="s_step">Step</label>' + stepSelect("s_step", saved.step ?? 10, false) +
        '<div class="panel"><strong>Step changes (optional)</strong>' +
        '<div class="muted">Use these if the step changes part way up the stack, e.g. from 100 lb the step becomes 15 lb.</div>' +
        changeRow(1) + changeRow(2) + "</div>" +
        numField("s_top", "Top pin (lb)", saved.top ?? null, "e.g. 150") +
        '<div class="panel"><strong>Weights on this machine</strong><div id="preview"></div>' +
        '<div class="other"><input id="s_add" type="number" inputmode="decimal" step="any" placeholder="Add a pin, e.g. 125"><button id="addBtn">Add pin</button></div></div>' +
        '<button class="primary" id="save">Save</button>' +
        (hasPins(e) ? '<button class="ghost" id="clear">Clear this machine</button>' : "");

      const readSpec = () => {
        const spec = { low: toNumber($("s_low").value), step: Number($("s_step").value), top: toNumber($("s_top").value), changes: [] };
        for (const n of [1, 2]) {
          const at = toNumber($("s_at" + n).value);
          const st = Number($("s_cs" + n).value);
          spec.changes.push({ at, step: st > 0 ? st : null });
        }
        return spec;
      };

      const drawPreview = (message) => {
        $("preview").innerHTML =
          '<div class="muted">' + esc(message) + "</div>" +
          (stackPins.length ? '<div class="muted small">' + stackPins.length + " weights. Tap one to remove it.</div>" : "") +
          stackPins.map((w) => '<button class="chip" data-w="' + w + '">' + w + "</button>").join("");
        $("preview").querySelectorAll(".chip").forEach((b) => {
          b.onclick = () => { stackPins = removePin(stackPins, Number(b.dataset.w)); drawPreview("Removed " + b.dataset.w + " lb."); };
        });
      };

      // Typing in the boxes rebuilds the list (this replaces any pins added or removed by hand).
      const rebuild = () => {
        const r = buildPins(readSpec());
        if (r.error) { drawPreview(r.error); return; }
        stackPins = r.pins;
        drawPreview(r.note || "Built from the boxes. Check it against the machine.");
      };
      for (const id of ["s_low", "s_step", "s_at1", "s_cs1", "s_at2", "s_cs2", "s_top"]) {
        $(id).addEventListener("input", rebuild);
        $(id).addEventListener("change", rebuild);
      }

      drawPreview(stackPins.length ? "Saved weights shown below." : "Fill in the boxes to see the weights.");

      $("addBtn").onclick = () => {
        const w = toNumber($("s_add").value);
        if (w !== null) { stackPins = addPin(stackPins, w); $("s_add").value = ""; drawPreview("Added " + w + " lb."); }
      };
      $("back").onclick = () => go("stacks");
      $("save").onclick = () => {
        if (stackPins.length === 0) { alert("Fill in the boxes first so there are weights to save."); return; }
        const spec = readSpec();
        settings = updateExercise(settings, e.id, {
          pins: stackPins,
          stackSpec: { low: spec.low, step: spec.step, top: spec.top, changes: spec.changes.filter((c) => c.at !== null && c.step !== null) },
        });
        save(SETTINGS_KEY, settings);
        go("stacks");
      };
      if ($("clear")) $("clear").onclick = () => {
        if (confirm("Remove the saved weights for this machine?")) {
          settings = updateExercise(settings, e.id, { pins: null, stackSpec: null });
          save(SETTINGS_KEY, settings);
          go("stacks");
        }
      };
    }
    armBack();
    render();

    // Lets the app open with no signal once it has been loaded once (needs https, so not on a plain LAN address).
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  </script>
</body>
</html>
