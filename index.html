<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Log</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px; background: #111; color: #eee; }
    h1 { font-size: 1.3rem; }
    h2 { font-size: 1.5rem; margin: 16px 0; }
    button, select, input { font-size: 1.2rem; padding: 14px; border-radius: 10px; border: 1px solid #444; background: #222; color: #eee; }
    .days { display: flex; gap: 8px; }
    .days button { flex: 1; }
    .days button.active { background: #2563eb; border-color: #2563eb; }
    #list button { display: block; width: 100%; text-align: left; margin-top: 8px; }
    #more { margin-top: 12px; width: 100%; background: transparent; }
    .back { width: 100%; background: transparent; }
    label { display: block; margin: 12px 0 6px; color: #aaa; }
    select { width: 100%; font-size: 1.5rem; }
    .other { display: flex; gap: 8px; margin-top: 8px; }
    .other input { flex: 1; min-width: 0; font-size: 1rem; }
    .other button { font-size: 1rem; }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .row button { width: 72px; font-size: 1.6rem; }
    .row .val { flex: 1; text-align: center; font-size: 1.6rem; }
    button.primary { width: 100%; background: #16a34a; border-color: #16a34a; font-size: 1.3rem; padding: 18px; margin-top: 8px; }
    #undo { width: 100%; margin-top: 8px; background: transparent; font-size: 0.95rem; padding: 10px; }
    #done { margin-top: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div id="listScreen">
    <h1>Gym Log</h1>
    <div class="days" id="days"></div>
    <div id="list"></div>
    <button id="more"></button>
  </div>

  <div id="exerciseScreen" hidden></div>

  <script type="module">
    import { exercisesForDay } from "./exercises.js";
    import { makeSet, todaysSets, defaultsFor, removeLastSet, weightOptions } from "./log.js";

    const dayNames = { legs: "Legs", upper: "Upper" };
    let day = "legs";
    let showMore = false;
    let selected = null;
    let weight = 0;
    let reps = 5;

    function loadSets() {
      try { return JSON.parse(localStorage.getItem("gymlog.sets")) || []; }
      catch { return []; }
    }
    function saveSets() {
      try { localStorage.setItem("gymlog.sets", JSON.stringify(sets)); }
      catch { /* storage unavailable: the app still works for this visit */ }
    }
    let sets = loadSets();

    const listScreen = document.getElementById("listScreen");
    const exerciseScreen = document.getElementById("exerciseScreen");
    const daysEl = document.getElementById("days");
    const listEl = document.getElementById("list");
    const moreEl = document.getElementById("more");

    function choose(e) {
      selected = e;
      const d = defaultsFor(e, sets);
      weight = d.weight;
      reps = d.reps;
      render();
    }

    function render() {
      window.scrollTo(0, 0);
      if (selected) {
        listScreen.hidden = true;
        exerciseScreen.hidden = false;
        renderExercise();
      } else {
        listScreen.hidden = false;
        exerciseScreen.hidden = true;
        renderList();
      }
    }

    function renderList() {
      daysEl.innerHTML = "";
      for (const key of Object.keys(dayNames)) {
        const b = document.createElement("button");
        b.textContent = dayNames[key];
        if (key === day) b.className = "active";
        b.onclick = () => { day = key; renderList(); };
        daysEl.appendChild(b);
      }

      listEl.innerHTML = "";
      for (const e of exercisesForDay(day, showMore)) {
        const b = document.createElement("button");
        b.textContent = e.name;
        b.onclick = () => choose(e);
        listEl.appendChild(b);
      }

      moreEl.textContent = showMore ? "Hide less common" : "Show less common";
      moreEl.onclick = () => { showMore = !showMore; renderList(); };
    }

    function renderExercise() {
      const unit = selected.unit;
      const today = todaysSets(sets, selected.id);
      const doneText = today.length === 0
        ? "No sets logged today"
        : today.map((s, i) => "Set " + (i + 1) + ": " + s.weight + " " + unit + " x " + s.reps).join("<br>");
      const optionHtml = weightOptions(selected, weight)
        .map((w) => '<option value="' + w + '"' + (w === weight ? " selected" : "") + ">" + w + " " + unit + "</option>")
        .join("");

      exerciseScreen.innerHTML =
        '<button class="back" id="back">&larr; Pick another machine</button>' +
        "<h2>" + selected.name + "</h2>" +
        "<label>Weight</label>" +
        '<select id="weightSel">' + optionHtml + "</select>" +
        '<div class="other"><input id="otherW" type="number" inputmode="decimal" step="any" placeholder="Other weight (' + unit + ')"><button id="otherBtn">Set</button></div>' +
        "<label>Reps</label>" +
        '<div class="row"><button id="rMinus">-</button><span class="val">' + reps + '</span><button id="rPlus">+</button></div>' +
        '<button class="primary" id="logBtn">Log set</button>' +
        (today.length > 0 ? '<button id="undo">Undo last set</button>' : "") +
        '<div id="done">' + doneText + "</div>";

      document.getElementById("back").onclick = () => { selected = null; render(); };
      document.getElementById("weightSel").onchange = (ev) => { weight = Number(ev.target.value); };
      document.getElementById("otherBtn").onclick = () => {
        const v = parseFloat(document.getElementById("otherW").value);
        if (Number.isFinite(v) && v >= 0) { weight = v; renderExercise(); }
      };
      document.getElementById("rMinus").onclick = () => { reps = Math.max(0, reps - 1); renderExercise(); };
      document.getElementById("rPlus").onclick = () => { reps = reps + 1; renderExercise(); };
      document.getElementById("logBtn").onclick = () => {
        sets.push(makeSet({ exerciseId: selected.id, weight, reps }));
        saveSets();
        renderExercise();
      };
      const undo = document.getElementById("undo");
      if (undo) undo.onclick = () => {
        sets = removeLastSet(sets, selected.id);
        saveSets();
        renderExercise();
      };
    }

    render();
  </script>
</body>
</html>
